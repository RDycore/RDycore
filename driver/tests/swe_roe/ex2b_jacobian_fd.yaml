# Wet-bed dam break (ex2b) with the explicit source treatment and the
# finite-difference-coloring RHS Jacobian enabled. Exercises the
# numerics.jacobian machinery (registration + config parsing); the Jacobian
# itself is only evaluated by TSAdjoint/implicit consumers, so this run also
# demonstrates the flag has no effect on explicit stepping. A shortened run
# (100 steps) of the standard planar dam break.

physics:
  flow:
    mode: swe
    source:
      method: explicit

numerics:
  spatial: fv
  temporal: euler
  riemann: roe
  jacobian: fd

logging:
  level: detail

time:
  stop: 0.0005
  unit: hours
  stop_n: 100

output:
  format: xdmf
  output_interval: 100
  batch_size: 20

grid:
  file: planar_dam_10x5.msh

regions:
  - name: upstream
    grid_region_id: 1
  - name: downstream
    grid_region_id: 2

surface_composition:
  - region: upstream
    material: smooth
  - region: downstream
    material: smooth

materials:
  - name: smooth
    properties:
      manning:
        value: 0.015

initial_conditions:
  - region: upstream
    flow: dam_top_ic
  - region: downstream
    flow: dam_bottom_ic

boundaries:
  - name: boundary
    grid_boundary_id: 1
  - name: top_wall
    grid_boundary_id: 2
  - name: bottom_wall
    grid_boundary_id: 3

boundary_conditions:
  - boundaries: [top_wall]
    flow: reflecting_bc
  - boundaries: [bottom_wall]
    flow: outflow_bc

flow_conditions:
  - name: dam_top_ic
    type: dirichlet
    height: 10
    x_momentum: 0
    y_momentum: 0
  - name: dam_bottom_ic
    type: dirichlet
    height: 5
    x_momentum: 0
    y_momentum: 0
  - name: reflecting_bc
    type: reflecting
  - name: outflow_bc
    type: critical-outflow
