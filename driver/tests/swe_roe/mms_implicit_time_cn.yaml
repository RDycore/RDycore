# Temporal MMS: spatially uniform state on a flat bed. The flux divergence of a
# uniform state is zero to round-off (and the Dirichlet values equal the interior
# state), so the error is pure time-integration error of the ODE
#   dU/dt = S_bed(U) + S_friction(U) + S_mms(t).
# Run with: rdycore_mms mms_implicit_time_cn.yaml [-ceed /cpu/self]
physics:
  flow:
    mode: swe

numerics:
  spatial : fv
  temporal: cn
  riemann : roe

mms:
  constants:
    H: 0.5    # water height scale [m]
    T: 2.0    # time scale [s]
    U: 0.3    # x-velocity scale [m/s]
    V: -0.2   # y-velocity scale [m/s]
    N: 0.05   # Manning coefficient
    Z: 0.0    # flat bed: a sloped bed adds an O(slope^2) spatial error (3D edge lengths)
  swe:
    h:    H * exp(t/T)
    dhdx: 0
    dhdy: 0
    dhdt: H / T * exp(t/T)

    u:    U * exp(t/T)
    dudx: 0
    dudy: 0
    dudt: U / T * exp(t/T)

    v:    V * exp(t/T)
    dvdx: 0
    dvdy: 0
    dvdt: V / T * exp(t/T)

    z:    Z * (x + 0.5 * y)
    dzdx: Z
    dzdy: 0.5 * Z

    n:    N

  convergence:
    num_refinements: 4
    base_refinement: 0
    time_only: true
    expected_rates:
      h:
        L1: 1.95
        L2: 1.95
        Linf: 1.95
      hu:
        L1: 1.95
        L2: 1.95
        Linf: 1.95
      hv:
        L1: 1.95
        L2: 1.95
        Linf: 1.95

logging:
  level: none

time:
  time_step        : 0.1
  unit             : seconds
  stop             : 1.0
  coupling_interval: 0.1

output:
  format: none

grid:
  file: mms_triangles_dx1.exo

regions:
  - name: domain
    grid_region_id: 1

boundaries:
  - name: domain_boundary
    grid_boundary_id: 1
