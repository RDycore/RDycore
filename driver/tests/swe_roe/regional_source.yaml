# A regional source must put its water in the region that declares it.
#
# The dam basin from ex2b, whose two cell sets differ in area, with two runoff
# conditions declared and no sources block: the gate script appends one, so
# that the same mesh and the same run length are used for every arm and only
# the region carrying the runoff changes.
#
# Areas matter here. A source that lands on the wrong region, or on no region
# at all, changes the water the domain ends up holding, and the two regions
# are different enough in size that the two arms cannot be confused.

physics:
  flow:
    mode: swe
    source:
      method: implicit_xq2018

numerics:
  spatial: fv
  temporal: euler
  riemann: roe

logging:
  level: detail

time:
  stop: 0.005
  unit: hours
  stop_n: 1000

checkpoint:
  format: binary
  interval: 100

output:
  format: xdmf
  output_interval: 100
  batch_size: 20
  time_series:
    boundary_fluxes: 10
    observations:
      interval: 10
      sites:
        cells: [0, 1, 2, 43]
      time_sampling:
        instantaneous: true

grid:
  file: planar_dam_10x5.msh

regions:
  - name: upstream
    grid_region_id: 1
  - name: downstream
    grid_region_id: 2

surface_composition:
  - region: upstream
    material: smooth
  - region: downstream
    material: smooth

materials:
  - name: smooth
    properties:
      manning:
        value: 0.015

initial_conditions:
  - region: upstream
    flow: dam_top_ic
  - region: downstream
    flow: dam_bottom_ic

boundaries:
  - name: boundary
    grid_boundary_id: 1
  - name: top_wall
    grid_boundary_id: 2
  - name: bottom_wall
    grid_boundary_id: 3

# Below we define BCs for "top_wall" and "bottom_wall", but do not specify
# the BC for "boundary". If no BC is specified for a boundary, the reflecting
# wall BC is assumed.
boundary_conditions:
  - boundaries: [top_wall]
    flow: reflecting_bc
  - boundaries: [bottom_wall]
    flow: outflow_bc

flow_conditions:
  - name: runoff_on
    type: runoff
    value: 0.01
  - name: runoff_off
    type: runoff
    value: 0.0
  - name: dam_top_ic
    type: dirichlet
    height: 10
    x_momentum: 0
    y_momentum: 0
  - name: dam_bottom_ic
    type: dirichlet
    height: 5
    x_momentum: 0
    y_momentum: 0
  - name: reflecting_bc
    type: reflecting
  - name: outflow_bc
    type: critical-outflow
