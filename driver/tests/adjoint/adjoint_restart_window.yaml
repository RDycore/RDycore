# Window leg of the checkpoint/restart consistency gate (see the adjoint
# CMakeLists): the SECOND hour only, started from adjoint_restart_ref.yaml's
# 1-hour checkpoint (-restart) with the rain re-aligned to event hour 1
# (-adjoint_rain_start_hour 1). Its final state must match the reference's.
#
# This is the path a mid-event calibration window uses: the only initial
# condition is at the start of the event, so the window's IC comes from a
# checkpoint of a longer forward, and -adjoint_rain_start_hour re-aligns the
# window's rain with the event clock (the TS clock always restarts at 0).
physics:
  flow:
    mode: swe
    source:
      method: explicit

numerics:
  spatial: fv
  temporal: beuler
  riemann: roe
  jacobian: analytic

logging:
  level: none

time:
  stop: 1.0
  unit: hours
  stop_n: 60

checkpoint:
  format: hdf5
  interval: 60
  prefix: restart_window

output:
  format: none

grid:
  file: Houston1km_with_z.exo

# one region represents the whole domain (the rain source targets region id 1)
regions:
  - name: domain
    grid_region_id: 1

surface_composition:
  - region: domain
    material: smooth

materials:
  - name: smooth
    properties:
      manning:
        value: 0.015

initial_conditions:
  - region: domain
    flow: domain_flow_ic

boundaries:
  - name: bottom_wall
    grid_boundary_id: 1

boundary_conditions:
  - boundaries: [bottom_wall]
    flow: outflow_bc

flow_conditions:
  - name: domain_flow_ic
    type: dirichlet
    file: Houston1km.ic.${PETSC_ID_TYPE}.bin
    format: binary
  - name: outflow_bc
    type: dirichlet
    height: 0
    x_momentum: 0
    y_momentum: 0
