# Land-cover-class calibration on the Houston 1 km mesh, sized for CI: a
# short window with the NLCD class map and prior (data/nlcd/), used to gate
# the -adjoint_classes_dump / -adjoint_classes_init warm-start round trip.
# A production calibration window needs more TAO iterations than fit in one
# queue slot, so it runs as a chain of jobs that hand the parameter vector
# forward; this checks the handoff actually resumes.
physics:
  flow:
    mode: swe
    source:
      method: explicit

numerics:
  spatial: fv
  temporal: beuler
  riemann: roe
  jacobian: analytic

logging:
  level: none

time:
  stop: 0.25
  unit: hours
  stop_n: 30


output:
  format: none

grid:
  file: Houston1km_with_z.exo

# one region represents the whole domain (the rain source targets region id 1)
regions:
  - name: domain
    grid_region_id: 1

surface_composition:
  - region: domain
    material: smooth

materials:
  - name: smooth
    properties:
      manning:
        value: 0.015

initial_conditions:
  - region: domain
    flow: domain_flow_ic

boundaries:
  - name: bottom_wall
    grid_boundary_id: 1

boundary_conditions:
  - boundaries: [bottom_wall]
    flow: outflow_bc

flow_conditions:
  - name: domain_flow_ic
    type: dirichlet
    file: Houston1km.ic.${PETSC_ID_TYPE}.bin
    format: binary
  - name: outflow_bc
    type: dirichlet
    height: 0
    x_momentum: 0
    y_momentum: 0
