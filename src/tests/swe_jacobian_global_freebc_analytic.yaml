# Twin of swe_jacobian_global_bc_*.yaml with the critical-outflow boundary
# replaced by the free-outflow (transmissive) condition: dam-break state with
# a Dirichlet top wall and a free-outflow bottom wall, used by
# test_swe_jacobian_global to compare the FD-coloring and analytic Jacobians.
# Validates the identity ghost map (qR = qL) of the free-outflow boundary
# through the exact Roe flux differential.

physics:
  flow:
    mode: swe
    source:
      method: explicit

numerics:
  spatial: fv
  temporal: euler
  riemann: roe
  jacobian: analytic

logging:
  level: none

time:
  stop: 0.0005
  unit: hours
  stop_n: 10

output:
  format: none

grid:
  file: planar_dam_10x5.msh

regions:
  - name: upstream
    grid_region_id: 1
  - name: downstream
    grid_region_id: 2

surface_composition:
  - region: upstream
    material: smooth
  - region: downstream
    material: smooth

materials:
  - name: smooth
    properties:
      manning:
        value: 0.03

initial_conditions:
  - region: upstream
    flow: dam_ic_up
  - region: downstream
    flow: dam_ic_down

boundaries:
  - name: boundary
    grid_boundary_id: 1
  - name: top_wall
    grid_boundary_id: 2
  - name: bottom_wall
    grid_boundary_id: 3

boundary_conditions:
  - boundaries: [top_wall]
    flow: fixed_bc
  - boundaries: [bottom_wall]
    flow: outflow_bc

flow_conditions:
  - name: dam_ic_up
    type: dirichlet
    height: 10
    x_momentum: 1
    y_momentum: -0.5
  - name: dam_ic_down
    type: dirichlet
    height: 5
    x_momentum: 1
    y_momentum: -0.5
  - name: reflecting_bc
    type: reflecting
  - name: fixed_bc
    type: dirichlet
    height: 7
    x_momentum: 1
    y_momentum: 0.5
  - name: outflow_bc
    type: free-outflow

